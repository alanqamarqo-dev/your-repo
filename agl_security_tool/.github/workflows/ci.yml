# AGL Security Tool - CI Pipeline
# Runs on every push/PR: lint + tests on Python 3.10, 3.11, 3.12

name: CI

on:
  push:
    branches: [master, agl_security, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check . --select=E,F,W --ignore=E501,E402,F841,W605

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run core tests
        run: |
          python -m pytest tests/test_detectors.py tests/test_solidity_parser.py tests/test_risk_core.py tests/test_contract_intelligence.py -v --tb=short

      - name: Run pipeline integration tests
        run: |
          python -m pytest tests/test_pipeline_integration.py tests/test_pipeline_fixes.py tests/test_pipeline_accuracy.py -v --tb=short --timeout=120

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
